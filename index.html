<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiperfiltración glomerular · simulador docente</title>
<meta name="description" content="Simulador interactivo de hiperfiltración glomerular: pérdida de nefronas, Ang II, vasoconstricción eferente, círculo vicioso y efecto de IECA/ARA II e iSGLT2.">
<link rel="stylesheet" href="src/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23c0392b' stroke-width='3'/%3E%3Cpath d='M9 16c3-6 5 6 7 0s4 6 7 0' fill='none' stroke='%23c0392b' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div>
    <h1 data-i18n="h1"></h1>
    <p class="sub" data-i18n="sub"></p>
  </div>
  <div class="top-right">
    <div class="lang" role="group" data-i18n-aria="lang.switch">
      <button type="button" class="btn small" data-lang="es" lang="es">ES</button>
      <button type="button" class="btn small" data-lang="en" lang="en">EN</button>
    </div>
    <div class="legend-tags"><span class="tag tag-model" data-i18n="tag.model"></span> <span data-i18n="legend.model"></span></div>
  </div>
</header>

<main class="layout">
  <!-- ============ CONTROLS ============ -->
  <section class="card controls" aria-labelledby="h-controls">
    <h2 id="h-controls" data-i18n="controls"></h2>

    <div class="transport">
      <button id="btn-play" class="btn primary" type="button" aria-pressed="false"></button>
      <button id="btn-reset" class="btn" type="button" data-i18n="reset"></button>
      <span id="clock" class="clock" aria-live="polite"></span>
    </div>

    <fieldset class="presets">
      <legend data-i18n="scenarios"></legend>
      <div class="preset-row" id="presets"></div>
      <p id="preset-expect" class="hint"></p>
    </fieldset>

    <div class="slider">
      <label for="s-loss"><span data-i18n="s.loss"></span> <output id="o-loss"></output></label>
      <input id="s-loss" type="range" min="0" max="95" step="1">
      <p class="hint" data-i18n="s.loss.hint"></p>
    </div>
    <div class="slider">
      <label for="s-map"><span data-i18n="s.map"></span> <output id="o-map"></output></label>
      <input id="s-map" type="range" min="60" max="150" step="1">
    </div>
    <div class="slider">
      <label for="s-ratio"><span data-i18n="s.ratio"></span> <output id="o-ratio"></output></label>
      <input id="s-ratio" type="range" min="1" max="10" step="0.5">
      <p class="hint" data-i18n="s.ratio.hint"></p>
    </div>
    <div class="slider">
      <label for="s-thr"><span><span data-i18n="s.thr"></span> <span class="tag tag-model" data-i18n="tag.model"></span></span> <output id="o-thr"></output></label>
      <input id="s-thr" type="range" min="55" max="75" step="0.5">
    </div>
    <div class="slider">
      <label for="s-speed"><span data-i18n="s.speed"></span> <output id="o-speed"></output></label>
      <input id="s-speed" type="range" min="0.25" max="8" step="0.25">
    </div>

    <fieldset class="toggles">
      <legend data-i18n="treatment"></legend>
      <label class="switch"><input id="t-ieca" type="checkbox"><span><span data-i18n="t.ieca"></span> <small data-i18n="t.ieca.small"></small></span></label>
      <label class="switch"><input id="t-sglt2" type="checkbox"><span><span data-i18n="t.sglt2"></span> <small data-i18n="t.sglt2.small"></small></span></label>
      <label class="switch subtle"><input id="t-cf" type="checkbox" checked><span data-i18n="t.cf"></span></label>
    </fieldset>

    <details class="advanced">
      <summary><span data-i18n="advanced"></span> <span class="tag tag-model" data-i18n="tag.model"></span></summary>
      <div class="slider">
        <label for="a-autoreg"><span data-i18n="a.autoreg"></span> <output id="o-autoreg"></output></label>
        <input id="a-autoreg" type="range" min="0" max="1" step="0.05">
      </div>
      <div class="slider">
        <label for="a-block"><span data-i18n="a.block"></span> <output id="o-block"></output></label>
        <input id="a-block" type="range" min="0" max="1" step="0.05">
      </div>
      <div class="slider">
        <label for="a-sglt"><span data-i18n="a.sglt"></span> <output id="o-sglt"></output></label>
        <input id="a-sglt" type="range" min="0" max="0.4" step="0.01">
      </div>
      <div class="slider">
        <label for="a-kdmg"><span data-i18n="a.kdmg"></span> <output id="o-kdmg"></output></label>
        <input id="a-kdmg" type="range" min="0" max="0.06" step="0.002">
      </div>
      <div class="slider">
        <label for="a-kprot"><span data-i18n="a.kprot"></span> <output id="o-kprot"></output></label>
        <input id="a-kprot" type="range" min="0" max="0.12" step="0.004">
      </div>
      <div class="slider">
        <label for="a-kage"><span data-i18n="a.kage"></span> <output id="o-kage"></output></label>
        <input id="a-kage" type="range" min="0" max="0.02" step="0.001">
      </div>
      <div class="slider">
        <label for="a-gain"><span data-i18n="a.gain"></span> <output id="o-gain"></output></label>
        <input id="a-gain" type="range" min="0" max="4" step="0.1">
      </div>
      <div class="slider">
        <label for="a-horizon"><span data-i18n="a.horizon"></span> <output id="o-horizon"></output></label>
        <input id="a-horizon" type="range" min="10" max="60" step="5">
      </div>
      <button id="btn-defaults" class="btn small" type="button" data-i18n="defaults"></button>
    </details>
  </section>

  <!-- ============ SCHEMATIC ============ -->
  <section class="card schematic" aria-labelledby="h-schem">
    <h2 id="h-schem" data-i18n="schem"></h2>
    <div id="glomerulus" class="glom-host"></div>
    <div class="starling">
      <div class="starling-head"><span data-i18n="starling"></span>
        <code>SNGFR = K<sub>f</sub> × (P<sub>GC</sub> − P<sub>BS</sub> − π<sub>GC</sub>)</code></div>
      <div class="starling-bars">
        <div class="sb-row"><span data-i18n="sb.for"></span><div class="sb-track"><div id="sb-pgc" class="sb pgc"></div></div><span id="sb-pgc-v"></span></div>
        <div class="sb-row"><span data-i18n="sb.against"></span><div class="sb-track"><div id="sb-pbs" class="sb pbs"></div><div id="sb-pi" class="sb pi"></div></div><span id="sb-against-v"></span></div>
        <div class="sb-row"><span data-i18n="sb.net"></span><div class="sb-track"><div id="sb-net" class="sb net"></div></div><span id="sb-net-v"></span></div>
      </div>
      <p class="hint" data-i18n="starling.hint"></p>
    </div>
  </section>

  <!-- ============ WHAT'S HAPPENING ============ -->
  <section class="card explain" aria-labelledby="h-exp">
    <h2 id="h-exp" data-i18n="explain"></h2>
    <ol id="cycle" class="cycle"></ol>
    <div id="treat-note" class="treat-note" hidden></div>
    <h3 data-i18n="log"></h3>
    <ul id="log" class="log" aria-live="polite"></ul>
  </section>

  <!-- ============ TILES ============ -->
  <section class="card stats">
    <div class="tiles" id="tiles"></div>
  </section>

  <!-- ============ CHARTS ============ -->
  <section class="card charts" aria-labelledby="h-charts">
    <h2 id="h-charts" data-i18n="charts"></h2>
    <div class="chart-legend" id="cf-legend"><span><i></i><span data-i18n="legend.current"></span></span><span><i class="cf"></i><span data-i18n="legend.cf"></span></span></div>
    <div class="chart-grid">
      <div id="c-gfr"></div>
      <div id="c-sngfr"></div>
      <div id="c-n"></div>
      <div id="c-pgc"></div>
      <div id="c-acr"></div>
      <div class="kdigo-host">
        <div class="chart-head"><span class="chart-title" data-i18n="kdigo"></span></div>
        <div id="kdigo"></div>
        <p class="hint" data-i18n="kdigo.hint"></p>
      </div>
    </div>
    <details class="table-view">
      <summary data-i18n="table"></summary>
      <div id="data-table"></div>
    </details>
  </section>

  <!-- ============ REFERENCE VALUES ============ -->
  <section class="card normals" aria-labelledby="h-norm">
    <h2 id="h-norm" data-i18n="normals"></h2>
    <ul id="normals-list"></ul>
    <p class="hint" data-i18n="normals.model"></p>
  </section>
</main>

<footer class="foot" data-i18n="footer"></footer>

<script type="module" src="src/ui.js"></script>
</body>
</html>
